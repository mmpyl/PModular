name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pmodular_ci
        options: >-
          --health-cmd "pg_isready -U postgres -d pmodular_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    defaults:
      run:
        working-directory: ./backend

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pmodular_ci?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pmodular_ci_shadow?schema=public

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create Prisma shadow database
        run: docker exec ${{ job.services.postgres.id }} createdb -U postgres pmodular_ci_shadow

      - name: Verify Prisma migration history matches schema
        run: npm run prisma:migrations:check

      - name: Verify migrations deploy to a clean database
        run: npm run prisma:migrate:deploy

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Run tests (if any)
        run: npm test --passWithNoTests
